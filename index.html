
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#fdfdfb">
    <link rel="manifest" href="manifest.json" />
    <!-- Replace this with the final FloraLife app icon file when branding is ready. -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/628/628283.png">
    <title>FloraLife</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply dark mode immediately to avoid flash
      (function() {
        const saved = localStorage.getItem('flora_life_dark_mode');
        const preferDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'true' || (saved === null && preferDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fdfdfb;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden; /* Fix for mobile elastic scrolling */
      }
      .dark body {
        background-color: #121211;
      }
      .mobile-frame {
        max-width: 480px;
        margin: 0 auto;
        height: 100vh;
        background: #fdfdfb;
        position: relative;
        overflow-y: auto;
      }
      .dark .mobile-frame {
        background: #121211;
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root" class="mobile-frame"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .catch(() => undefined);
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
